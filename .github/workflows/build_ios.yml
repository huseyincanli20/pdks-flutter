name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS Runner Sunucusu (arm64 / x86_64)'
        required: true
        default: 'macos-latest'
        type: choice
        options:
          - 'macos-latest'
          - 'macos-15'
          - 'macos-14'
          - 'macos-13'

jobs:
  build-ios:
    name: Build iOS IPA on Cloud macOS (${{ github.event.inputs.runner || 'macos-latest' }})
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r pdks_flutter.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdks-ios-ipa
          path: pdks_flutter.ipa
          retention-days: 14
