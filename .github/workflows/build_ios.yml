name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS Runner Sunucusu'
        required: true
        default: 'macos-latest'
        type: choice
        options:
          - 'macos-latest'
          - 'macos-14'
          - 'macos-13'
          - 'macos-15'

jobs:
  build-ios:
    name: Build iOS IPA on Cloud macOS (${{ github.event.inputs.runner || 'macos-latest' }})
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          cd ios
          pod repo update || true
          pod install
          cd ..

      - name: Build iOS Application (Release)
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr pdks_flutter.ipa Payload
          shasum -a 256 pdks_flutter.ipa > pdks_flutter.ipa.sha256
          rm -rf Payload
          echo "### 📱 iOS IPA Paketi Başarıyla Üretildi! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Dosya Adı:** \`pdks_flutter.ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Doğrulama Kodu:** \`$(cat pdks_flutter.ipa.sha256)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Mimari:** arm64 (iOS Release)" >> $GITHUB_STEP_SUMMARY
          echo "- **Yükleme:** Sideloadly, AltStore, TrollStore veya MDM/TestFlight ile yüklenebilir." >> $GITHUB_STEP_SUMMARY

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdks-ios-ipa
          path: |
            pdks_flutter.ipa
            pdks_flutter.ipa.sha256
          retention-days: 14
